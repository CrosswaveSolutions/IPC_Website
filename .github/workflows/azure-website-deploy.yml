name: Deploy to Azure Web App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_WEBAPP_NAME: ipcwebsite
  SOLUTION_FILE: "Power Coatins.sln"       # or the .csproj path

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore packages
        run: nuget restore "${{ env.SOLUTION_FILE }}"

      - name: Build and package
        run: >
          msbuild "${{ env.SOLUTION_FILE }}"
          /p:Configuration=Release
          /p:DeployOnBuild=true
          /p:WebPublishMethod=Package
          /p:PackageAsSingleFile=true
          /p:PackageLocation="${{ github.workspace }}\publish"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: publish\*.zip

  deploy:
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app
          path: publish

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_BC5FB212EAC14DF1AC14A3DFE1E5D154 }}
          #client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_594F24BFE7174CC6AF60E6C9D05C6F08 }}
          #tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_7C1D345391824DF6BDCCE0AA7A0D12C7}}
          #subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: publish\*.zip
