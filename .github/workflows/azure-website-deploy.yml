name: Deploy Web Site to Azure App Service

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: ipcwebsite   # must match the app name in Azure
  SITE_PATH: '.'                        # folder containing Default.aspx and Web.config

jobs:
  deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.SITE_PATH }}

# ---------------------------------------------------------------------------
# SITE_PATH examples:
#   '.'              site files sit at the repo root
#   'CrosswaveWeb'   site files sit in a subfolder
#   'src/website'    nested
#
# The folder you point at must be the one containing Default.aspx and
# Web.config -- not the folder above it.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# OPTIONAL: precompile before deploying.
# Catches syntax errors in CI instead of at runtime on the first page hit,
# and slightly improves cold-start time. Add this step before the deploy step
# and change the deploy package to 'compiled'.
